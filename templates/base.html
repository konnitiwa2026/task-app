<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}タスク管理システム{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- 共通ナビゲーションバー（ログイン時のみ表示） -->
    {% if session.get('user') %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">タスク管理App</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">ダッシュボード</a>
                <a class="nav-link" href="/tasks">タスク一覧</a>
                <a class="btn btn-outline-danger btn-sm ms-3" href="/logout">ログアウト</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <!-- 各画面のコンテンツが入るブロック -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 独自 CSS (static/style.css) の読み込み -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</body>
</html>
