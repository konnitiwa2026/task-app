{% extends "base.html" %}

{% block title %}ダッシュボード - タスク管理システム{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <!-- Bootstrap の Card コンポーネント -->
        <div class="card shadow border-0 rounded-3">
            <div class="card-header bg-primary text-white p-3">
                <h4 class="m-0">ダッシュボード</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">ようこそ、<strong class="text-primary">{{ session.get('user') }}</strong> さん！</p>
                <hr>
                <div class="d-grid gap-2 col-md-6 mx-auto mt-4">
                    <a href="/tasks" class="btn btn-success btn-lg">
                        タスク一覧画面を表示
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
