{% extends 'base.html' %}

{% block layout %}
<div class="container py-5">
    <div class="row justify-content-center text-center my-4">
        <div class="col-md-8">
            <div class="mb-3 text-primary">
                <i class="bi bi-geo-alt-fill display-3"></i>
            </div>
            <h2 class="fw-bold">地域の困りごと報告システム</h2>
            <p class="text-muted">みんなの声で、よりよいまちをつくる</p>
            <p class="small text-secondary px-md-5">このシステムは、地域の困りごと（道路破損・街灯故障など）を住民から受け付け、AIで分析・分類し、行政の迅速な対応を支援するサービスです。</p>
        </div>
    </div>

    <div class="row justify-content-center g-3 col-md-6 mx-auto">
        <div class="col-12">
            <a href="{{ url_for('login_citizen') }}" class="btn btn-primary btn-lg w-100 py-3 shadow-sm fw-bold">
                <i class="bi bi-person-fill me-2"></i>市民の方はこちら（ログイン）
            </a>
        </div>
        <div class="col-12">
            <a href="{{ url_for('login_staff') }}" class="btn btn-success btn-lg w-100 py-3 shadow-sm fw-bold">
                <i class="bi bi-building me-2"></i>行政職員の方はこちら（ログイン）
            </a>
        </div>
        <div class="col-12">
            <a href="{{ url_for('login_admin') }}" class="btn btn-secondary btn-lg w-100 py-3 shadow-sm fw-bold">
                <i class="bi bi-gear-fill me-2"></i>管理者の方はこちら（ログイン）
            </a>
        </div>
    </div>
</div>
{% endblock %}
