{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-secondary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-gear-fill fs-1"></i>
                </div>
                <h3 class="fw-bold">管理者ログイン</h3>
                <p class="text-muted small">管理者アカウントでログインしてください。</p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('login_admin') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">管理者ID</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <!-- @なしのID（例: admin01）を入力できるように変更 -->
                                <input type="text" name="admin_id" class="form-control" placeholder="例) admin01" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">パスワード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="パスワードを入力してください" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100 py-2 fw-bold">ログイン</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="small text-muted text-decoration-none">← トップページに戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
