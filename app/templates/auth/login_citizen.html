{% extends 'layouts/base.html' %}

{% block layout %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
                    <i class="bi bi-person-fill fs-1"></i>
                </div>
                <h3 class="fw-bold">市民ログイン</h3>
                <p class="text-muted small">登録したメールアドレスとパスワードを入力してください。</p>
            </div>

            {% if error %}
            <!-- 6. ログインエラー例表示 -->
            <div class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="{{ url_for('login_citizen') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">メールアドレス</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="例) taro@example.com" required>
                            </div>
                            <small class="text-muted" style="font-size:0.75rem;">※ 「error@example.com」でログインテストをするとエラー表示になります</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">パスワード</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="パスワードを入力してください" required>
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label small" for="remember">ログイン状態を保持する</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">ログイン</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="#" class="small text-decoration-none">パスワードを忘れた方はこちら</a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="small text-muted text-decoration-none">← トップページに戻る</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
